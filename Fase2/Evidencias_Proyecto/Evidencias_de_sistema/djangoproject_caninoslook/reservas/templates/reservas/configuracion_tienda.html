{% extends 'reservas/base.html' %}

{% block content %}
  <h1>Configuración de la Tienda</h1>
  <h2>Configuraciones generales</h2>

  <form method="POST">
    {% csrf_token %}
    <div>
      <label for="tienda_nombre">Nombre de la tienda</label>
      <input type="text" id="tienda_nombre" name="tienda_nombre" value="{{ tienda.nombre }}" required>
    </div>

    <div>
      <label for="tienda_email">Correo electrónico de contacto</label>
      <input type="email" id="tienda_email" name="tienda_email" value="{{ tienda.email }}" required>
    </div>

    <div>
      <button type="submit">Guardar cambios</button>
    </div>
  </form>
{% endblock %}
