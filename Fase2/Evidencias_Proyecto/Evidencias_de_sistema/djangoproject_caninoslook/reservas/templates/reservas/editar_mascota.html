{% extends "reservas/base.html" %}
{% block title %}Editar Mascota - CaninosLook{% endblock %}
{% block content %}
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="card col-12 col-md-8 col-lg-6 p-4 shadow-sm">
      <h2 class="mb-3">Editar Mascota: {{ canino.nombre_can }}</h2>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex gap-2 mt-3">
          <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
          <a href="{% url 'mis_mascotas' %}" class="btn btn-outline-secondary w-100">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
