{% extends "reservas/base.html" %}
{% block title %}Crear Cuenta - CaninosLook{% endblock %}

{% block content %}
  <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card col-12 col-md-8 col-lg-6 p-4 shadow-sm">
      <h2 class="mb-4 text-center">📝 Registro de Cliente</h2>
      <p class="text-muted text-center mb-4">Todos los campos marcados con <span class="text-danger">*</span> son obligatorios.</p>

      <form method="post">
        {% csrf_token %}

        <!-- Campos del formulario -->
        {{ form.as_p }}

        <!-- Medidor de contraseña -->
        <div class="progress mt-2">
          <div id="passwordStrength" class="progress-bar" role="progressbar" style="width: 0%;" aria-valuenow="0"
               aria-valuemin="0" aria-valuemax="100"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100 mt-3">Registrar</button>
        <a href="{% url 'login' %}" class="btn btn-outline-secondary w-100 mt-2">¿Ya tienes cuenta? Inicia sesión</a>
      </form>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById("id_password_cli");
    const strengthBar = document.getElementById("passwordStrength");

    passwordInput.addEventListener("input", () => {
      const val = passwordInput.value;
      let strength = 0;
      if (val.length >= 8) strength += 25;
      if (/[A-Z]/.test(val)) strength += 25;
      if (/[a-z]/.test(val)) strength += 25;
      if (/[0-9]/.test(val)) strength += 25;

      strengthBar.style.width = strength + "%";
      strengthBar.className = "progress-bar";
      if (strength < 50) strengthBar.classList.add("bg-danger");
      else if (strength < 75) strengthBar.classList.add("bg-warning");
      else strengthBar.classList.add("bg-success");
    });
  </script>
{% endblock %}
